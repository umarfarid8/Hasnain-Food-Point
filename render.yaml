services:
  - type: web
    name: hasnain-food-point-api
    runtime: docker
    dockerfilePath: ./HasnainFoodPoint.Api/Dockerfile
    dockerContext: ./HasnainFoodPoint.Api
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DISABLE_HTTPS_REDIRECT
        value: "true"
      - key: DatabaseProvider
        value: Sqlite
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=hasnain_food_point.db
      - key: Cors__AllowedOrigins
        value: "http://localhost:5173,https://localhost,capacitor://localhost,http://localhost,https://hasnain-food-point.vercel.app,https://hasnain-food-point.netlify.app"
