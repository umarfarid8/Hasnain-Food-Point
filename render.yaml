services:
  - type: web
    name: hasnain-food-point-api
    runtime: docker
    dockerfilePath: ./HasnainFoodPoint.Api/Dockerfile
    dockerContext: ./HasnainFoodPoint.Api
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DISABLE_HTTPS_REDIRECT
        value: "true"
      - key: DatabaseProvider
        value: SqlServer
      - key: ConnectionStrings__DefaultConnection
        value: Server=YOUR_MONSTERASP_SERVER;Database=YOUR_DATABASE;User Id=YOUR_USER;Password=YOUR_PASSWORD;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - key: Cors__AllowedOrigins
        value: "https://hasnainfoodpoint.netlify.app,http://localhost:5173,https://localhost,capacitor://localhost,http://localhost,https://hasnain-food-point.vercel.app,https://hasnain-food-point.netlify.app"
